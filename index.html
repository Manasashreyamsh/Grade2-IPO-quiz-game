<!DOCTYPE html>
<html>
<head>
<title>IPO Quiz Game</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Fredoka',cursive;
  text-align:center;
  background:linear-gradient(#ffe0b2,#ffccbc);
}

.container{
  background:white;
  padding:20px;
  margin:20px auto;
  width:400px;
  border-radius:20px;
  box-shadow:0 5px 10px gray;
}

img{
  width:180px;
  height:140px;
}

button{
  width:100%;
  padding:12px;
  margin:6px;
  border:none;
  border-radius:12px;
  background:#ff4081;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#f50057;
}

#timer{
  color:red;
  font-size:20px;
}

.stars{
  font-size:30px;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div class="container" id="startScreen">
<h1>🎮 IPO Quiz Game</h1>
<input type="text" id="playerName" placeholder="Enter Name">
<br><br>
<button onclick="startGame()">Start Game ⭐</button>
</div>

<!-- GAME SCREEN -->
<div class="container" id="gameScreen" style="display:none;">
<h2 id="welcome"></h2>
<p id="timer">Time: 60</p>

<img id="questionImg">

<button onclick="check('Input')">🎤 Input</button>
<button onclick="check('Output')">📺 Output</button>
<button onclick="check('Storage')">💾 Storage</button>
<button onclick="check('Processor')">🧠 Processor</button>
</div>

<!-- RESULT SCREEN -->
<div class="container" id="resultScreen" style="display:none;">
<h1 id="finalName"></h1>
<h2 id="finalScore"></h2>
<div class="stars" id="stars"></div>
<h3 id="message"></h3>

<button id="certBtn" onclick="generateCertificate()" style="display:none;">
🏆 Get Certificate
</button>

<br><br>
<button onclick="location.reload()">🔄 Play Again</button>
</div>

<!-- CANVAS -->
<canvas id="canvas" width="700" height="500" style="display:none;"></canvas>

<script>

let questions=[
 {img:"images/keyboard.png", ans:"Input"},
 {img:"images/monitor.png", ans:"Output"},
 {img:"images/harddisk.png", ans:"Storage"},
 {img:"images/cpu.png", ans:"Processor"},
 {img:"images/mouse.png", ans:"Input"},
 {img:"images/printer.png", ans:"Output"},
 {img:"images/pendrive.png", ans:"Storage"},
 {img:"images/cpu.png", ans:"Processor"},
 {img:"images/speaker.png", ans:"Output"},
 {img:"images/scanner.png", ans:"Input"}
];

let i=0, score=0, time=60, player="";

function startGame(){
 player=document.getElementById("playerName").value || "Player";
 document.getElementById("startScreen").style.display="none";
 document.getElementById("gameScreen").style.display="block";

 document.getElementById("welcome").innerText="Welcome "+player+" ⭐";

 loadQuestion();
 startTimer();
}

function loadQuestion(){
 if(i>=questions.length){
   endGame();
   return;
 }
 document.getElementById("questionImg").src=questions[i].img;
}

function check(ans){
 if(ans===questions[i].ans){
   score++;
 }
 i++;
 loadQuestion();
}

function startTimer(){
 let t=setInterval(()=>{
   time--;
   document.getElementById("timer").innerText="Time: "+time;

   if(time<=0){
     clearInterval(t);
     endGame();
   }
 },1000);
}

function endGame(){

 document.getElementById("gameScreen").style.display="none";
 document.getElementById("resultScreen").style.display="block";

 let message="", stars="";

 if(score>=7){
   message="🌟 Excellent!";
   stars="⭐⭐⭐⭐⭐";
   document.getElementById("certBtn").style.display="block";
 }
 else if(score>=5){
   message="😊 Very Good!";
   stars="⭐⭐⭐";
 }
 else{
   message="🙂 Try Again!";
   stars="⭐";
 }

 document.getElementById("finalName").innerText=player;
 document.getElementById("finalScore").innerText="Score: "+score+"/10";
 document.getElementById("stars").innerText=stars;
 document.getElementById("message").innerText=message;
}

function generateCertificate(){

 let canvas=document.getElementById("canvas");
 let ctx=canvas.getContext("2d");

 ctx.fillStyle="#fff3e0";
 ctx.fillRect(0,0,700,500);

 ctx.strokeStyle="#ff9800";
 ctx.lineWidth=8;
 ctx.strokeRect(20,20,660,460);

 ctx.fillStyle="#e91e63";
 ctx.font="bold 36px Fredoka";
 ctx.fillText("🏆 Certificate of Achievement 🏆",70,100);

 ctx.fillStyle="#000";
 ctx.font="22px Fredoka";
 ctx.fillText("DPS Grade 2 Computer Quiz",170,170);

 ctx.fillText("Congratulations",250,230);

 ctx.font="bold 28px Fredoka";
 ctx.fillText(player,280,280);

 ctx.font="22px Fredoka";
 ctx.fillText("You scored "+score+"/10",240,330);

 ctx.fillText("⭐⭐⭐⭐⭐",260,380);

 let link=document.createElement("a");
 link.download="certificate.png";
 link.href=canvas.toDataURL("image/png");
 link.click();
}

</script>

</body>
</html>
